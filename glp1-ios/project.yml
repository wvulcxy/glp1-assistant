name: "GLP-1用药助手"
options:
  bundleIdPrefix: com.glp1
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    INFOPLIST_FILE: "Resources/Info.plist"
    PRODUCT_BUNDLE_IDENTIFIER: com.glp1.assistant
    PRIVACY_INFO_FILE: "Resources/PrivacyInfo.xcprivacy"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""  # ← 填你的 Apple Developer Team ID
    CODE_SIGN_STYLE: "Automatic"
    TARGETED_DEVICE_FAMILY: "1"  # iPhone only

targets:
  GLP1:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Assets
      - path: Resources/LaunchScreen.storyboard
    settings:
      base:
        INFOPLIST_FILE: "Resources/Info.plist"
        PRIVACY_INFO_FILE: "Resources/PrivacyInfo.xcprivacy"
    dependencies: []
